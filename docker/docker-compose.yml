name: nocobase-8196

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      openfhe:
        condition: service_healthy
      security-runtime:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - nocobase

  security-runtime:
    build:
      context: ../security-runtime-service
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
      init-data:
        condition: service_completed_successfully
      openfhe:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nocobase@postgres:5432/nocobase
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 配置数据库密码}
      MANAGEMENT_API_URL: http://app/api/
      HOMOMORPHIC_SERVICE_URL: http://openfhe:8088
      RUNTIME_ENFORCE_SOURCE_IP: ${RUNTIME_ENFORCE_SOURCE_IP:-false}
      RUNTIME_TRUST_PROXY_HEADERS: "true"
      SUBJECT_SECRETS_JSON: >-
        {"secret://subjects/internal-a":"${SUBJECT_INTERNAL_A_SECRET:?请配置内部主体A凭据}","secret://subjects/internal-b":"${SUBJECT_INTERNAL_B_SECRET:?请配置内部主体B凭据}","secret://subjects/external-c":"${SUBJECT_EXTERNAL_C_SECRET:?请配置外部主体凭据}","secret://subjects/online-grid":"${SUBJECT_DEMO_SECRET:?请配置客户应用演示主体凭据}","secret://subjects/marketing-2":"${SUBJECT_DEMO_SECRET}","secret://subjects/line-loss":"${SUBJECT_DEMO_SECRET}","secret://subjects/line-relation":"${SUBJECT_DEMO_SECRET}","secret://subjects/sales-forecast":"${SUBJECT_DEMO_SECRET}","secret://subjects/credit-electric":"${SUBJECT_DEMO_SECRET}","secret://subjects/data-govern":"${SUBJECT_DEMO_SECRET}","secret://subjects/external-env":"${SUBJECT_DEMO_SECRET}","secret://subjects/data-transfer":"${SUBJECT_DEMO_SECRET}","secret://subjects/full-link-monitor":"${SUBJECT_DEMO_SECRET}","secret://subjects/smart-city":"${SUBJECT_DEMO_SECRET}","secret://subjects/multi-source":"${SUBJECT_DEMO_SECRET}","secret://subjects/digital-substation":"${SUBJECT_DEMO_SECRET}","secret://subjects/charging":"${SUBJECT_DEMO_SECRET}","secret://subjects/new-energy":"${SUBJECT_DEMO_SECRET}","secret://subjects/audit":"${SUBJECT_DEMO_SECRET}","secret://subjects/discipline":"${SUBJECT_DEMO_SECRET}","secret://subjects/intelligent-dispatch":"${SUBJECT_DEMO_SECRET}"}
      SOURCE_SECRETS_JSON: >-
        {"secret://security/source/src-yc20-001":"${POSTGRES_PASSWORD:?请配置数据源凭据}","secret://security/source/src-ems-001":"${POSTGRES_PASSWORD}","secret://security/source/src-tmr-001":"${POSTGRES_PASSWORD}","secret://security/source/src-distribution-001":"${POSTGRES_PASSWORD}","secret://security/source/src-cable-001":"${POSTGRES_PASSWORD}","secret://security/source/src-weather-001":"${POSTGRES_PASSWORD}","secret://security/source/src-hvcable-001":"${POSTGRES_PASSWORD}","secret://security/source/mysql-validation":"${MYSQL_VALIDATION_PASSWORD:-}"}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${SECURITY_RUNTIME_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    networks:
      nocobase:
        aliases:
          - data-provider

  openfhe:
    platform: linux/amd64
    build:
      context: ../openfhe-service
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${OPENFHE_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    networks:
      - nocobase

  app:
    image: nocobase/nocobase:2.1.21-full
    restart: always
    init: true
    command: ["/bin/sh", "/usr/local/bin/security-app-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_KEY: ${NOCOBASE_APP_KEY:?请在 docker/.env 配置应用密钥}
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 配置数据库密码}
      INIT_ROOT_USERNAME: ${NOCOBASE_ADMIN_ACCOUNT:-nocobase}
      INIT_ROOT_EMAIL: ${NOCOBASE_ADMIN_EMAIL:-admin@nocobase.com}
      INIT_ROOT_PASSWORD: ${NOCOBASE_ADMIN_PASSWORD:-admin123}
      INIT_ROOT_NICKNAME: ${NOCOBASE_ADMIN_NICKNAME:-Super Admin}
      TZ: Asia/Shanghai
    volumes:
      - ./storage:/app/nocobase/storage
      - ./app/plugins:/plugins:ro
      - ./app/scripts/security-app-entrypoint.sh:/usr/local/bin/security-app-entrypoint.sh:ro
    ports:
      - "${NOCOBASE_PORT:-8196}:80"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/api/app:getInfo').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - nocobase

  init-data:
    image: node:20-alpine
    restart: "no"
    init: true
    working_dir: /init
    depends_on:
      app:
        condition: service_healthy
    environment:
      NOCOBASE_API_BASE_URL: http://app/api/
      NOCOBASE_ADMIN_ACCOUNT: ${NOCOBASE_ADMIN_ACCOUNT:-nocobase}
      NOCOBASE_ADMIN_PASSWORD: ${NOCOBASE_ADMIN_PASSWORD:-admin123}
      NOCOBASE_AUTHENTICATOR: basic
      FORCE_REINIT: ${FORCE_REINIT:-false}
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 配置数据库密码}
    volumes:
      - ../scripts:/init/scripts:ro
      - ../package.json:/init/package.json:ro
      - ../package-lock.json:/init/package-lock.json:ro
      - ./v3.0/initdb/04-init-dictionary-views.sql:/init/dictionary-views.sql:ro
      - ./storage/init:/init/state
    entrypoint: ["/bin/sh", "/init/scripts/docker-init-v31.sh"]
    networks:
      - nocobase

  postgres:
    image: postgres:16
    restart: always
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_DB: nocobase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 配置数据库密码}
      TZ: Asia/Shanghai
    volumes:
      - ./storage/db/postgres:/var/lib/postgresql/data
      - ./postgres/init-measurement-data.sh:/docker-entrypoint-initdb.d/20-init-measurement-data.sh:ro
      - ./v3.0/initdb/02-init-measurement-demo.sql:/opt/measurement-demo.sql:ro
      - ./v3.0/initdb/03-init-measurement-v31.sql:/opt/measurement-v31.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocobase -d nocobase"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      nocobase:
        aliases:
          - measurement-db

networks:
  nocobase:
    driver: bridge
