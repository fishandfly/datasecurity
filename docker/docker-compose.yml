name: nocobase-8196

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      openfhe:
        condition: service_healthy
      security-runtime:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - nocobase

  security-runtime:
    build:
      context: ../security-runtime-service
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
      openfhe:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nocobase@postgres:5432/nocobase
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 配置数据库密码}
      MANAGEMENT_API_URL: http://app/api/
      HOMOMORPHIC_SERVICE_URL: http://openfhe:8088
      RUNTIME_ENFORCE_SOURCE_IP: ${RUNTIME_ENFORCE_SOURCE_IP:-false}
      RUNTIME_TRUST_PROXY_HEADERS: "true"
      SUBJECT_SECRETS_JSON: >-
        {"secret://subjects/internal-a":"${SUBJECT_INTERNAL_A_SECRET:?请配置内部主体A凭据}","secret://subjects/internal-b":"${SUBJECT_INTERNAL_B_SECRET:?请配置内部主体B凭据}","secret://subjects/external-c":"${SUBJECT_EXTERNAL_C_SECRET:?请配置外部主体凭据}"}
      SOURCE_SECRETS_JSON: >-
        {"secret://security/source/src-yc20-001":"${POSTGRES_PASSWORD:?请配置数据源凭据}","secret://security/source/mysql-validation":"${MYSQL_VALIDATION_PASSWORD:-}"}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    networks:
      nocobase:
        aliases:
          - data-provider

  openfhe:
    platform: linux/amd64
    build:
      context: ../openfhe-service
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    networks:
      - nocobase

  app:
    image: nocobase/nocobase:2.1.21-full
    restart: always
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_KEY: ${NOCOBASE_APP_KEY:?请在 docker/.env 配置应用密钥}
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: nocobase
      DB_USER: nocobase
      DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 配置数据库密码}
      TZ: Asia/Shanghai
    volumes:
      - ./storage:/app/nocobase/storage
    ports:
      - "8196:80"
    networks:
      - nocobase

  postgres:
    image: postgres:16
    restart: always
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_DB: nocobase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 配置数据库密码}
      TZ: Asia/Shanghai
    volumes:
      - ./storage/db/postgres:/var/lib/postgresql/data
      - ./postgres/init-measurement-data.sh:/docker-entrypoint-initdb.d/20-init-measurement-data.sh:ro
      - ./v3.0/initdb/02-init-measurement-demo.sql:/opt/measurement-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocobase -d nocobase"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      nocobase:
        aliases:
          - measurement-db

networks:
  nocobase:
    driver: bridge
